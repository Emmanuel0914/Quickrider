<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickRider - Vendor Portal</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body class="bg-slate-950 text-slate-50 min-h-screen flex flex-col items-center py-10 px-4 selection:bg-indigo-500/30">

    <div class="w-full max-w-md flex justify-end mb-2 hidden" id="vendorNav">
        <button onclick="logoutVendor()" class="text-xs font-bold text-slate-500 hover:text-rose-400 flex items-center gap-1 transition-colors"><i data-lucide="log-out" class="w-3 h-3"></i> Logout</button>
    </div>

    <div class="w-full max-w-md bg-slate-900/50 backdrop-blur-xl border border-white/10 p-8 rounded-2xl shadow-2xl relative overflow-hidden hidden" id="mainDashboard">
        <div class="text-center mb-8 relative z-10">
            <h2 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent mb-1">QuickRider</h2>
            <p class="text-indigo-400 text-xs font-bold uppercase tracking-widest" id="welcomeText">Vendor Portal</p>
        </div>

        <form id="deliveryForm" class="space-y-5 relative z-10">
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Pickup Address</label>
                <div class="relative group"><i data-lucide="map-pin" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i><input type="text" id="pickup" class="w-full pl-10 pr-4 py-2.5 bg-slate-950/50 border border-slate-800 rounded-lg text-sm focus:outline-none focus:border-indigo-500/50" required></div>
            </div>
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Drop-off Address</label>
                <div class="relative group"><i data-lucide="navigation" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i><input type="text" id="dropoff" class="w-full pl-10 pr-4 py-2.5 bg-slate-950/50 border border-slate-800 rounded-lg text-sm focus:outline-none focus:border-indigo-500/50" required></div>
            </div>
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Payload Description</label>
                <div class="relative group"><i data-lucide="package" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i><input type="text" id="item" class="w-full pl-10 pr-4 py-2.5 bg-slate-950/50 border border-slate-800 rounded-lg text-sm focus:outline-none focus:border-indigo-500/50" required></div>
            </div>
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Receiver's Phone</label>
                <div class="relative group"><i data-lucide="phone" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i><input type="tel" id="phone" class="w-full pl-10 pr-4 py-2.5 bg-slate-950/50 border border-slate-800 rounded-lg text-sm focus:outline-none focus:border-indigo-500/50" required></div>
            </div>
            <div class="space-y-1">
                <label class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">Your Base Offer (₦)</label>
                <div class="relative group"><i data-lucide="wallet" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-indigo-400"></i><input type="number" id="offerPrice" placeholder="e.g. 1500" class="w-full pl-10 pr-4 py-2.5 bg-indigo-500/10 border border-indigo-500/30 rounded-lg text-sm font-bold text-white focus:outline-none focus:border-indigo-500" required></div>
            </div>
            <button type="submit" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-lg transition-all shadow-[0_0_15px_rgba(79,70,229,0.3)] flex justify-center items-center gap-2"><i data-lucide="radio" class="w-4 h-4"></i> Broadcast to Network</button>
        </form>

        <div id="vendorTracking" class="mt-8 pt-6 border-t border-slate-800/50 hidden relative z-10">
            <h3 class="text-sm font-bold text-slate-300 mb-4 flex items-center gap-2"><i data-lucide="activity" class="w-4 h-4 text-cyan-400"></i> Active Dispatches</h3>
            <div id="myOrdersList" class="space-y-4 mb-6"></div>
            <h3 class="text-sm font-bold text-slate-300 mb-4 flex items-center gap-2 border-t border-slate-800/50 pt-4"><i data-lucide="archive" class="w-4 h-4 text-slate-500"></i> Delivery History</h3>
            <div id="myHistoryList" class="space-y-4"></div>
        </div>
    </div>

    <div id="authModal" class="fixed inset-0 z-[300] bg-slate-950/95 backdrop-blur-md flex items-center justify-center">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-sm">
            <div class="text-center mb-6"><img src="https://i.pinimg.com/736x/f9/24/e0/f924e0328e89eaa6c6022dfd7bec3ed6.jpg" class="w-20 h-20 rounded-2xl object-cover mx-auto mb-6 border-2 border-slate-700"><h2 class="text-2xl font-bold text-white">Vendor Access</h2></div>
            <form id="authForm" class="space-y-4">
                <div><label class="text-xs font-semibold text-slate-400 uppercase">Username</label><div class="relative group mt-1"><i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i><input type="text" id="authUsername" class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-lg text-white" required></div></div>
                <div><label class="text-xs font-semibold text-slate-400 uppercase">Password</label><div class="relative group mt-1"><i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i><input type="password" id="authPassword" class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-lg text-white" required></div></div>
                <p id="authError" class="text-xs text-rose-500 font-bold hidden text-center"></p>
                <button type="submit" id="authBtn" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg shadow-[0_0_15px_rgba(79,70,229,0.3)]">Access Portal</button>
            </form>
        </div>
    </div>

    <div id="qrModal" class="fixed inset-0 z-[100] bg-slate-950/80 backdrop-blur-sm flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-sm transform scale-95 transition-all duration-300" id="qrModalContent"><div class="flex items-center gap-3 mb-2"><div id="qrModalIconContainer" class="p-2 rounded-full bg-indigo-500/10"><i id="qrModalIcon" data-lucide="alert-circle" class="w-5 h-5 text-indigo-400"></i></div><h3 id="qrModalTitle" class="text-lg font-bold text-white">Attention</h3></div><p id="qrModalMessage" class="text-sm text-slate-400 mb-6 mt-2">Message.</p><div class="flex gap-3 justify-end" id="qrModalButtons"></div></div>
    </div>

    <script>
        lucide.createIcons();
        let loggedInUsername = localStorage.getItem('qr_vendor_username');
        let refreshInterval;
        let knownDeliveries = JSON.parse(localStorage.getItem('qr_known_deliveries')) || [];

        function checkAuth() {
            if (loggedInUsername) {
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('mainDashboard').classList.remove('hidden');
                document.getElementById('vendorNav').classList.remove('hidden');
                document.getElementById('welcomeText').innerText = `Welcome back, ${loggedInUsername}`;
                loadVendorOrders(); refreshInterval = setInterval(loadVendorOrders, 3000);
            } else {
                document.getElementById('authModal').classList.remove('hidden');
                document.getElementById('mainDashboard').classList.add('hidden');
                document.getElementById('vendorNav').classList.add('hidden');
                if(refreshInterval) clearInterval(refreshInterval);
            }
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('authUsername').value.trim().toLowerCase();
            const pass = document.getElementById('authPassword').value;
            const errorText = document.getElementById('authError');
            try {
                const res = await fetch('/vendor-auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: user, password: pass }) });
                const data = await res.json();
                if (res.ok) { localStorage.setItem('qr_vendor_username', user); loggedInUsername = user; errorText.classList.add('hidden'); checkAuth(); } 
                else { errorText.innerText = data.message; errorText.classList.remove('hidden'); }
            } catch (err) { errorText.innerText = "Network error."; errorText.classList.remove('hidden'); }
        });

        function logoutVendor() { localStorage.removeItem('qr_vendor_username'); loggedInUsername = null; checkAuth(); }
        
        function showModal(type, title, message, confirmBtnText = "OK", isDestructive = false) {
            return new Promise((resolve) => {
                const modal = document.getElementById('qrModal'); const modalContent = document.getElementById('qrModalContent');
                const btnContainer = document.getElementById('qrModalButtons'); const icon = document.getElementById('qrModalIcon');
                const iconContainer = document.getElementById('qrModalIconContainer');
                document.getElementById('qrModalTitle').innerText = title; document.getElementById('qrModalMessage').innerText = message;
                
                if (isDestructive) { icon.setAttribute('data-lucide', 'alert-triangle'); icon.className = "w-5 h-5 text-rose-500"; iconContainer.className = "p-2 rounded-full bg-rose-500/10"; } 
                else { icon.setAttribute('data-lucide', 'info'); icon.className = "w-5 h-5 text-indigo-400"; iconContainer.className = "p-2 rounded-full bg-indigo-500/10"; }
                
                btnContainer.innerHTML = '';
                const closeModal = () => { modal.classList.add('opacity-0'); modalContent.classList.add('scale-95'); setTimeout(() => modal.classList.add('hidden'), 300); };
                if (type === 'confirm') {
                    const cancelBtn = document.createElement('button'); cancelBtn.className = "px-4 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white"; cancelBtn.innerText = "Cancel"; cancelBtn.onclick = () => { closeModal(); resolve(false); }; btnContainer.appendChild(cancelBtn);
                }
                const confirmBtn = document.createElement('button'); confirmBtn.className = `px-4 py-2 rounded-lg text-sm font-bold text-white transition-colors shadow-lg ${isDestructive ? "bg-rose-600" : "bg-indigo-600"}`; confirmBtn.innerText = confirmBtnText; confirmBtn.onclick = () => { closeModal(); resolve(true); }; btnContainer.appendChild(confirmBtn);
                modal.classList.remove('hidden'); setTimeout(() => { modal.classList.remove('opacity-0'); modalContent.classList.remove('scale-95'); }, 10); lucide.createIcons();
            });
        }
        const customConfirm = (title, msg, btnText, isDestructive) => showModal('confirm', title, msg, btnText, isDestructive);
        const customAlert = (title, msg) => showModal('alert', title, msg, "OK", false);

        // 1. STANDARD FREE BROADCAST
        document.getElementById('deliveryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const orderData = {
                pickup: document.getElementById('pickup').value, dropoff: document.getElementById('dropoff').value,
                item: document.getElementById('item').value, phone: document.getElementById('phone').value,
                price: parseInt(document.getElementById('offerPrice').value), vendorId: loggedInUsername 
            };
            await fetch('/order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(orderData) });
            document.getElementById('deliveryForm').reset();
            loadVendorOrders();
        });

        // 2. THE PAYSTACK ESCROW TRIGGER (Only fired when Vendor accepts a rider)
        function payAndLockRider(orderId, agreedAmount) {
            let handler = PaystackPop.setup({
                // 🛑 PASTE YOUR PAYSTACK KEY HERE
                key: 'pk_test_83022bc020131c95224b33a5bc9d7e3a8bd4ddb5', 
                
                email: loggedInUsername + "@quickrider.ng",
                amount: agreedAmount * 100, 
                currency: 'NGN',
                ref: 'QR_' + Math.floor((Math.random() * 1000000000) + 1), 
                callback: function(response) {
                    fetch('/pay-and-lock', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: orderId, finalPrice: agreedAmount, paymentRef: response.reference })
                    }).then(() => {
                        customAlert("Escrow Funded", `₦${agreedAmount} is locked in escrow. The dispatcher is en route!`);
                        loadVendorOrders();
                    });
                },
                onClose: function() { customAlert("Payment Required", "You must fund escrow to lock in this dispatcher."); }
            });
            handler.openIframe();
        }

        async function declineCounter(jobId) {
            await fetch('/decline-counter', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: jobId }) });
            loadVendorOrders();
        }
        async function cancelOrder(jobId) {
            const isSure = await customConfirm("Abort Dispatch?", "Are you sure you want to cancel this dispatch?", "Yes, Abort", true);
            if(!isSure) return; 
            await fetch('/cancel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: jobId }) });
            loadVendorOrders();
        }
        async function deleteHistory(jobId) {
            const isSure = await customConfirm("Erase Record?", "Permanently delete this delivery receipt?", "Delete", true);
            if(!isSure) return; 
            await fetch('/delete-history', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: jobId }) });
            loadVendorOrders();
        }

        async function loadVendorOrders() {
            if(!loggedInUsername) return; 
            try {
                const response = await fetch('/orders'); const orders = await response.json();
                const myOrders = orders.filter(o => o.vendorId === loggedInUsername);
                const tracking = document.getElementById('vendorTracking');
                const list = document.getElementById('myOrdersList'); const history = document.getElementById('myHistoryList');

                if (myOrders.length > 0) {
                    tracking.classList.remove('hidden'); list.innerHTML = ''; history.innerHTML = ''; 
                    let hasActive = false; let hasHistory = false;
                    
                    myOrders.forEach(order => {
                        let statusUI = ""; let actionUI = ""; let riderDedicatedUI = ""; 

                        if (order.status === "Pending Rider") {
                            statusUI = `<p class="text-[10px] text-amber-500 font-mono mt-0.5 animate-pulse">PENDING...</p>`;
                            actionUI = `<button onclick="cancelOrder('${order.id}')" class="text-xs text-rose-400 border border-rose-500/20 bg-rose-500/10 px-3 py-1.5 rounded-lg hover:bg-rose-500/20 transition-colors">Abort</button>`;
                            hasActive = true;
                        } 
                        else if (order.status === "Awaiting Escrow") { // RIDER ACCEPTED BASE PRICE!
                            statusUI = `<p class="text-[10px] text-emerald-400 font-bold mt-1 uppercase animate-pulse">Rider Accepted ₦${order.price}!</p>`;
                            actionUI = `<button onclick="payAndLockRider('${order.id}', ${order.price})" class="text-xs font-bold bg-indigo-500 hover:bg-indigo-400 text-white px-4 py-2 rounded-lg shadow-[0_0_10px_rgba(99,102,241,0.5)] transition-all flex items-center gap-1"><i data-lucide="lock" class="w-3 h-3"></i> Pay ₦${order.price} to Start</button>`;
                            riderDedicatedUI = `<div class="mt-4 pt-4 border-t border-slate-800/50"><div class="flex items-center gap-4 bg-slate-900/80 p-3 rounded-xl border border-slate-700/50"><img src="https://api.dicebear.com/7.x/initials/svg?seed=${order.riderName || 'Rider'}&backgroundColor=4f46e5" class="w-12 h-12 rounded-full border-2 border-slate-700"><div><p class="text-sm font-bold text-white">${order.riderName || 'Unknown'}</p><p class="text-[10px] font-mono text-slate-400 mt-0.5"><i data-lucide="shield-check" class="w-3 h-3 inline text-indigo-400"></i> Plate: ${order.riderPlate || 'N/A'}</p></div></div></div>`;
                            hasActive = true;
                        }
                        else if (order.status === "Counter-Offer") { // RIDER WANTS MORE MONEY!
                            statusUI = `<p class="text-[10px] text-orange-400 font-bold mt-1 uppercase animate-pulse">Rider asks for ₦${order.counterPrice}</p>`;
                            actionUI = `
                                <div class="flex flex-col sm:flex-row gap-2">
                                    <button onclick="payAndLockRider('${order.id}', ${order.counterPrice})" class="text-xs font-bold bg-indigo-500 hover:bg-indigo-400 text-white px-4 py-2 rounded-lg shadow-[0_0_10px_rgba(99,102,241,0.5)] transition-all">Pay & Lock ₦${order.counterPrice}</button>
                                    <button onclick="declineCounter('${order.id}')" class="text-xs font-bold bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 px-4 py-2 rounded-lg transition-all">Decline</button>
                                </div>
                            `;
                            riderDedicatedUI = `<div class="mt-4 pt-4 border-t border-slate-800/50"><div class="flex items-center gap-4 bg-slate-900/80 p-3 rounded-xl border border-slate-700/50"><img src="https://api.dicebear.com/7.x/initials/svg?seed=${order.riderName || 'Rider'}&backgroundColor=4f46e5" class="w-12 h-12 rounded-full border-2 border-slate-700"><div><p class="text-sm font-bold text-white">${order.riderName || 'Unknown'}</p><p class="text-[10px] font-mono text-slate-400 mt-0.5"><i data-lucide="shield-check" class="w-3 h-3 inline text-indigo-400"></i> Plate: ${order.riderPlate || 'N/A'}</p></div></div></div>`;
                            hasActive = true;
                        }
                        else if (order.status === "En Route") { // PAID!
                            statusUI = `<p class="text-[10px] text-cyan-400 font-mono mt-1"><i data-lucide="truck" class="w-3 h-3 inline"></i> EN ROUTE</p>`;
                            actionUI = `<div class="flex flex-col items-end"><span class="text-xs text-slate-400 mb-1">Escrow Locked</span><span class="text-xl text-cyan-400 font-black">₦${order.price}</span></div>`;
                            riderDedicatedUI = `<div class="mt-4 pt-4 border-t border-slate-800/50"><p class="text-[10px] text-cyan-400 uppercase tracking-wider mb-3 font-bold flex items-center gap-1"><i data-lucide="shield-check" class="w-3 h-3"></i> Verified Dispatcher Secured</p><div class="flex items-center gap-4 bg-indigo-900/20 p-4 rounded-xl border border-indigo-500/30 shadow-inner"><div class="relative"><img src="https://api.dicebear.com/7.x/initials/svg?seed=${order.riderName || 'Rider'}&backgroundColor=4f46e5" class="w-16 h-16 rounded-full border-2 border-indigo-400"><div class="absolute -bottom-1 -right-1 w-5 h-5 bg-emerald-500 rounded-full flex items-center justify-center"><i data-lucide="check" class="w-3 h-3 text-slate-950 font-bold"></i></div></div><div class="flex-1"><p class="text-xl font-extrabold text-white">${order.riderName || 'Unknown'}</p><p class="text-xs font-mono text-slate-300 mt-1">Plate: ${order.riderPlate || 'N/A'}</p></div></div></div>`;
                            hasActive = true;
                        }
                        else if (order.status === "Delivered") {
                            statusUI = `<p class="text-[10px] text-emerald-400 font-mono mt-0.5"><i data-lucide="check-circle" class="w-3 h-3 inline"></i> DELIVERED</p>`;
                            actionUI = `<div class="flex items-center gap-3"><span class="text-xs text-emerald-400 font-bold bg-emerald-400/10 px-2 py-1 rounded">₦${order.price}</span><button onclick="deleteHistory('${order.id}')" class="text-slate-500 hover:text-rose-500 p-2 bg-slate-900 rounded-full"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`;
                            hasHistory = true;
                        }

                        const cardHTML = `<div class="bg-slate-950/60 border border-slate-800 rounded-2xl p-5 mb-4"><div class="flex justify-between items-start"><div><h3 class="text-base font-bold text-slate-200">${order.item}</h3>${statusUI}</div>${actionUI}</div>${riderDedicatedUI}</div>`;
                        if (order.status === "Delivered") history.innerHTML += cardHTML; else list.innerHTML += cardHTML;
                    });
                    if (!hasActive) list.innerHTML = `<div class="p-4 text-center"><p class="text-xs text-slate-500 italic">No active dispatches.</p></div>`;
                    if (!hasHistory) history.innerHTML = `<div class="p-4 text-center"><p class="text-xs text-slate-500 italic">No completed deliveries.</p></div>`;
                    lucide.createIcons();
                } else tracking.classList.add('hidden'); 
            } catch (error) {}
        }

        checkAuth();
    </script>
</body>
</html>
